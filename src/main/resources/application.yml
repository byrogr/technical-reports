spring:
  application:
    name: technical-reports

  # Base de datos (valores por defecto para el PostgreSQL local de compose.yaml)
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/technical_reports_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:secret}

  # El esquema lo gestiona Flyway; Hibernate solo valida que las entidades coincidan
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

# Documentación OpenAPI: /v3/api-docs y Swagger UI en /swagger-ui.html.
# En producción se desactiva con API_DOCS_ENABLED=false
springdoc:
  writer-with-order-by-keys: true
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

app:
  # JWT: la clave (mínimo 32 caracteres para HS256) llega siempre por variable de entorno
  jwt:
    secret: ${JWT_SECRET}
    expiration: 10h

  # Usuario inicial: se crea al arrancar solo si la tabla users está vacía
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
