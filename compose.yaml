# PostgreSQL para desarrollo local: docker compose up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: technical_reports_db
      POSTGRES_USER: root
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
